filebeat.inputs:
  - type: filestream
    id: cnc-stream
    paths:
      - /mnt/cnc-stream/*.csv
    exclude_lines: ['^timestamp']
    file_identity:
      path: '~'

output.kafka:
  hosts: ["kafka:9092"]
  topic: "cnc-sensors-raw"
  codec.format:
    string: '%{[message]}'

logging.level: info
logging.to_files: false
