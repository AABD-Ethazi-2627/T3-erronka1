# CNC Guard — Filebeat Konfigurazioa
# IKASLEEK OSATU BEHAR DUTE
# ═══════════════════════════════════════════════════════════════════

# 1. SARRERA: Zer fitxategi begiratu behar ditu Filebeat-ek?
filebeat.inputs:
  - type: filestream
    id: cnc-stream
    paths:
      - /mnt/cnc-stream/*.csv
    exclude_lines: ['^timestamp']

output.kafka:
  hosts: ["kafka:9092"]
  topic: "cnc-sensors-raw"
  codec.format:
    string: '%{[message]}'

logging.level: info
logging.to_files: false
