# ═══════════════════════════════════════════════════════════════════
# CNC Guard — Filebeat Konfigurazioa
# IKASLEEK OSATU BEHAR DUTE
# ═══════════════════════════════════════════════════════════════════

# 1. SARRERA: Zer fitxategi begiratu behar ditu Filebeat-ek?
filebeat.inputs:
  - type: filestream
    id: cnc-stream
    paths:
      - /mnt/cnc-stream/*.csv

    # CSV fitxategiek goiburu-lerro bat dute (zutabe-izenak).
    # Lerro hori ez bidali Kafka-ra — nola iragazi?
    exclude_lines: ['^machine_id']

    # NFS-ekin lan egiten ari garenez, fitxategi-jarraipena
    # path bidez egin behar da (inodo-aldaketak ekiditeko)
    file_identity:
      path: ~

# 2. IRTEERA: Nora bidali datuak?
# Kafka topiko batera bidaltzen ditugu — NiFi-k handik kontsumituko ditu.
# Lerro gordina bidali, ez Beats event JSON osoa (codec.format erabili).
output.kafka:
  hosts:
    - "kafka:9092"
  topic: "cnc-sensors-raw"
  codec.format:
    string: '%{[message]}'

# 3. ERREGISTROA
logging.level: info
logging.to_files: false
