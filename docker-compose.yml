version: '3.8'

services:

  # ── Kafka — Mezularitza bufferra (KRaft mode, zookeeper gabe) ────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cnc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    restart: unless-stopped

  # ── Filebeat — CSV fitxategien irakurlea ─────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.1
    container_name: cnc-filebeat
    command: filebeat -e -strict.perms=false
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-data:/usr/share/filebeat/data
      # NFS bidez ikasle VM-an /mnt/cnc-stream-en muntatutako karpeta irakurtzeko:
      - /mnt/cnc-stream:/mnt/cnc-stream:ro
    depends_on:
      - kafka
    restart: unless-stopped

  # ── Apache NiFi — Transformazioa eta bideratzea ──────────────────────────────
  nifi:
    image: apache/nifi:1.23.2
    container_name: cnc-nifi
    ports:
      - "8443:8443" # Web Interfazea (https://localhost:8443)
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=adminpassword123
      - NIFI_WEB_HTTPS_PORT=8443
    depends_on:
      - kafka
      - elasticsearch
    restart: unless-stopped

  # ── Elasticsearch — Biltegiratze eta bilaketa ────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: cnc-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ── Kibana — Bistaratzea ─────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: cnc-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ── Scoring API — ML inferentzia (3. fasea) ──────────────────────────────────
  # scoring-api:
  #   build:
  #     context: ./scoring
  #   container_name: cnc-scoring
  #   ports:
  #     - "8000:8000" # FastAPI (http://localhost:8000/docs)
  #   volumes:
  #     - ./models:/models:ro # Modeloa hemen egon behar da: ./models/cnc_failure_model.pkl
  #   environment:
  #     MODEL_PATH: /models/cnc_failure_model.pkl
  #   restart: unless-stopped

volumes:
  filebeat-data: # Filebeat registry (zer fitxategi irakurri den gogoratzeko)
  es-data: # Elasticsearch datuen iraunkortasuna
